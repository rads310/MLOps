name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install dvc dvc-http dvc-s3 evidently pandas scikit-learn joblib mlflow pandera pytest ruff fastapi httpx
      - name: Проверка кода линтером
        run: ruff check src/ tests/ || true
      - name: Скачивание данных из DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user rads310
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull -f
      - name: Запуск тестов
        run: pytest -v
