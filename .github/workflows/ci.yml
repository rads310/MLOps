name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Линтер и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Окружение строго из uv.lock
        run: uv sync --locked

      - name: Стиль и типичные ошибки
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Тесты
        run: uv run pytest -q

  pipeline:
    name: Пайплайн и метрики
    runs-on: ubuntu-latest
    needs: checks
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Данные из хранилища
        run: uv run dvc pull

      - name: Воспроизведение пайплайна
        run: uv run dvc repro

      - name: Пайплайн не должен требовать пересчёта
        run: uv run dvc status

      - name: Метрики в сводку запуска
        run: |
          {
            echo "### Метрики после dvc repro"
            echo '```json'
            cat reports/metrics.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Метрики комментарием к pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = fs.readFileSync('reports/metrics.json', 'utf8');
            const head = '**Метрики после `dvc repro`**';
            const body = [head, '```json', metrics, '```'];
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join('\n'),
            });
